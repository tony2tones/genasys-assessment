<h1 class="text-2xl m-4 p-2">Quote Management</h1>
<button mat-button (click)="createQuote()">Create Quote</button>
<mat-form-field appearance="outline" class="customer-filter">
  <mat-label>Filter by customer</mat-label>
  <input
    matInput
    [ngModel]="filterText()"
    (ngModelChange)="filterText.set($event)"
    placeholder="e.g. John Biggs"
  />
  @if (filterText()) {
    <button matSuffix mat-icon-button aria-label="Clear" (click)="filterText.set('')">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>

<table mat-table matSort [dataSource]="dataSource">
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer name</th>
    <td mat-cell *matCellDef="let quote">{{ quote.customerName }}</td>
  </ng-container>
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Amount</th>
    <td mat-cell *matCellDef="let quote">{{ quote.amount }}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let quote">
      <span class="status-pill" [class]="quote.status.toLowerCase()">
        {{ quote.status }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let quote">
      <button mat-icon-button [matMenuTriggerFor]="actionsMenu" aria-label="Row actions">
        <mat-icon>more_vert</mat-icon>
      </button>

      <mat-menu #actionsMenu="matMenu" class="actions-menu-panel">
        <button mat-menu-item (click)="updateInsuranceQuote(quote)">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </button>
        <button mat-menu-item (click)="onDeleteQuote(quote)" class="warn-item">
          <mat-icon color="warn">delete</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell no-data-cell" [attr.colspan]="displayColumns.length">
      @if (filterText() || customerId()) {
        No quotes found matching your filter.
      } @else {
        No quotes yet.
      }
    </td>
  </tr>
</table>
